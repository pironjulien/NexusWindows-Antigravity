[project]
name = "antigravity-computer-use"
version = "2.4.3"
description = "SOTA Windows OS Computer Use & Spotlight Companion for Google Antigravity"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "mss>=9.0,<11",
    "pillow>=10.0,<12",
    "uiautomation>=2.0,<3",
    "websockets>=12.0,<17",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/_live", ".backups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
