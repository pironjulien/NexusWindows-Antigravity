[project]
name = "nexus-windows-antigravity"
version = "3.4.3"
description = "NexusWindows for Antigravity: Windows computer use in the background for Google Antigravity (MCP server)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julien Piron" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "windows", "computer-use", "ui-automation", "antigravity", "gemini"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "comtypes>=1.4.17,<2; sys_platform == 'win32'",
    "mcp>=2.3.0,<3",
    "mss>=9.0,<11",
    "pillow>=13.0.0,<14",
    "uiautomation>=2.0,<3; sys_platform == 'win32'",
    "websocket-client>=1.8,<2",
]

[project.urls]
Homepage = "https://julienpiron.fr/nexuswindows/antigravity/"
Repository = "https://github.com/pironjulien/NexusWindows-Antigravity"
Changelog = "https://github.com/pironjulien/NexusWindows-Antigravity/blob/main/CHANGELOG.md"
Issues = "https://github.com/pironjulien/NexusWindows-Antigravity/issues"

[project.scripts]
nexus-windows-antigravity = "nexus_windows_antigravity.launch:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Le dossier client/ devient le paquet nexus_windows_antigravity (modules chargés à plat par launch.py).
[tool.hatch.build.targets.wheel]
packages = ["client"]

[tool.hatch.build.targets.wheel.sources]
"client" = "nexus_windows_antigravity"

# Plugin Antigravity (guide de l'agent, manifeste) livré dans la roue : `nexus-windows-antigravity install` le pose.
[tool.hatch.build.targets.wheel.force-include]
"plugins/nexus-computer" = "nexus_windows_antigravity/plugin"

[tool.hatch.build.targets.sdist]
include = ["client/", "plugins/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "uv.lock", "server.json"]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8.0,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
line-length = 120
target-version = "py311"
# Copie publique seulement : modules de NexusWindows/commun copiés dans client/ par l'export (vérifiés dans leur propre dépôt).
extend-exclude = ["client/foreground_lock.py", "client/garde_fous.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["client", "scripts", "tests"]
pythonVersion = "3.11"
# Modules charges par chemin (sys.path) : le client et les modules communs du dossier commun voisin (NexusWindows/commun).
extraPaths = ["client", ".", "../commun"]
