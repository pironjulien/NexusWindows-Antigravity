name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Test environment (the Python environment install.ps1 creates, without registering the server)
        shell: pwsh
        run: |
          . ./scripts/runtime.ps1
          uv sync --frozen --quiet
      - name: test.ps1 (ruff, pyright, unit tests; offline)
        shell: pwsh
        run: ./test.ps1

  startup-linux:
    # What MCP directories (Glama) check in a Linux container: the server starts and lists its tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: initialize + tools/list over stdio
        run: |
          uv sync --frozen --quiet
          uv run --frozen pytest -q --noconftest -p no:cacheprovider tests/test_startup.py
